name: CI

on:
  # Every branch, not just master: work pushed before a PR exists used to get no
  # signal at all, so a branch could accumulate broken commits for a whole meeting
  # and only discover it at PR time. Runs are ~1m24s and the repo is public, so
  # Actions minutes are free — there is nothing to save by waiting for the PR.
  push:
    branches: ['**']
  # Kept alongside the push trigger so PRs opened from a fork are still checked.
  # The cost is that a push to a branch with an open PR produces two runs: `push`
  # and `pull_request` land in different concurrency groups and do not cancel
  # each other. Accepted deliberately — dropping this trigger would dedupe, but
  # would leave fork PRs unchecked.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # run_number, not ref_name: branch names can contain / (invalid in artifact names).
          name: canopy-apk-${{ github.run_number }}
          path: TeamCode/build/outputs/apk/debug/*.apk
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Scoped to TeamCode: the stock FtcRobotController module is not ours
      # to lint and would add noise.
      - name: Lint TeamCode (lintDebug)
        run: ./gradlew :TeamCode:lintDebug --stacktrace

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (testDebugUnitTest)
        run: ./gradlew testDebugUnitTest --stacktrace
