name: Simulate Auto

# The Visualizer's "Save to GitHub" commits an Auto's .pp, its generated Java and
# TeamCode/sim-request.json (what to simulate) together. This runs that request
# through SimRunTest and publishes the result on the `sim-results` branch, where
# the Visualizer reads it back:
#
#   <auto>/<commit>/result.json        the Auto alone: every seed's points, TIPs, LEAVE/PARK, problems; and
#                                      "entries", the results table of every run (alone, and each partner at each timing)
#   <auto>/<commit>/<auto>-<commit7>-seed-<n>.wpilog   the best and the median seed, for AdvantageScope
#   <auto>/<commit>/<partner>/<timing>/result.json, <auto>-<commit7>-<partner>-<timing>-seed-<n>.wpilog
#                                      the same for each partner run the request lists (TeamCode/autos/partners/, the
#                                      partner's .pp name and the timing's name: partner-l-launch-park/fires-at-5-s)
#   <auto>/latest.json                 the newest result for that Auto, on its usual robot design
#   <auto>/latest-best.wpilog, latest-typical.wpilog   its logs, at names that never change
#   <auto>/with/<partner>/<timing>/latest.json, latest-best.wpilog, latest-typical.wpilog
#                                      the newest result of that partner run
#   <auto>/designs/<design>/latest.json, latest-best.wpilog, latest-typical.wpilog
#                                      the same, for each robot design it has been simulated with
#   <auto>[/designs/<design>]/<title>_<YYYY-MM-DD>_best.wpilog (and _typical)   the same, named for the Auto (the request's
#                                      "title") and the day it last changed; kept, for README links
#
# An Auto's usual design is the one its <auto>/latest.json already has (the first one it was
# simulated with). A run on another design, side walls say, goes only to designs/<design>/, so
# the README's best/typical links keep showing the usual robot and both stay downloadable.
# A request with "usual": true makes its design the usual one from then on (after a design is renamed,
# say "builders' option 3 (5 Oct CAD)" to "flat intake").
#
# `sim-results` is rewritten as a single commit each time and keeps the newest
# KEEP_RUNS results, so logs never pile up in the repository's history.
# A request is TeamCode/sim-request.json, or on the fast lane (an auto/<name> branch, opened by the
# Visualizer's Save & Simulate into master) the Auto's own TeamCode/sim-requests/<name>.json, so two
# Autos in flight never conflict. Not on master itself: the save's own branch already ran it.
# The request lists the Auto's curated partner runs ("partners": each a stand-in from TeamCode/autos/partners/
# at a timing; TeamCode/autos/README.md). SimRunTest runs the Auto alone, then each of those; the whole job
# should stay under about five minutes, so a request gives its partner runs fewer seeds ("partnerSeeds").
#
# The request is a file the pushed commit itself changed (against its first parent) and that still
# exists. A merge commit (merging master into a branch, say) changes none: the request files it brings
# in changed on another branch, which already simulated them, so it skips and the check passes.
on:
  push:
    branches-ignore: [master]
    paths: ['TeamCode/sim-request.json', 'TeamCode/sim-requests/**']

permissions:
  contents: write

# One at a time: each run rewrites sim-results from the one before.
concurrency:
  group: simulate-auto
  cancel-in-progress: false

env:
  KEEP_RUNS: '40'

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # the pushed commit and its parent(s): which request it changed

      - name: Write the request
        id: request
        run: |
          mkdir -p "$RUNNER_TEMP/sim"
          python3 - <<'EOF'
          import json, os, subprocess, sys
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout.split()
          def skip(why):
              print(f"Nothing to simulate: {why}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("skip=true\n")
              sys.exit(0)
          # The files the pushed commit changed, against its first parent (a merge commit's own diff-tree
          # is empty, which once sent this to a shared file master does not have). A root commit has no parent.
          has_parent = subprocess.run(["git", "rev-parse", "-q", "--verify", "HEAD^1"], capture_output=True).returncode == 0
          changed = git("diff", "--name-only", "HEAD^1", "HEAD") if has_parent else git("diff-tree", "--root", "--no-commit-id", "--name-only", "-r", "HEAD")
          requests = sorted(f for f in changed if os.path.isfile(f) and f.endswith(".json")
                            and (f.startswith("TeamCode/sim-requests/") or f == "TeamCode/sim-request.json"))
          if subprocess.run(["git", "rev-parse", "-q", "--verify", "HEAD^2"], capture_output=True).returncode == 0:
              # A merge commit: whatever request files it brings in changed on another branch, and nothing
              # about those Autos changed here.
              skip("a merge commit; the request files it carries (" + (", ".join(requests) or "none") + ") were simulated on their own branch")
          if not requests:
              skip("this commit changed no request file that still exists (looked for TeamCode/sim-requests/*.json, then TeamCode/sim-request.json)")
          # An Auto's own file first, else the shared one.
          own = [f for f in requests if f.startswith("TeamCode/sim-requests/")]
          path = own[0] if own else requests[0]
          print(f"Request: {path}")
          req = json.load(open(path))
          meta = req.setdefault("metadata", {})
          meta["SourceCommit"] = os.environ["GITHUB_SHA"]
          meta["SourceBranch"] = os.environ["GITHUB_REF_NAME"]
          meta["SourcePath"] = req.get("pp", "")
          meta["SimRun"] = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          json.dump(req, open(os.path.join(os.environ["RUNNER_TEMP"], "sim", "request.json"), "w"))
          # The results folder: the request's "folder" when set (one route run with two partners publishes to two
          # folders, 8 Oct 2026), else the Auto's file name.
          auto = req.get("folder") or os.path.basename(req.get("pp", "unknown.pp"))[:-3]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"auto={auto}\n")
          EOF

      - name: Set up JDK 17
        if: steps.request.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.request.outputs.skip != 'true'
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        if: steps.request.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Simulate (SimRunTest)
        if: steps.request.outputs.skip != 'true'
        id: sim
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          BIOBUZZ_SIM_RUN="$RUNNER_TEMP/sim" ./gradlew :TeamCode:testDebugUnitTest \
            --tests org.firstinspires.ftc.teamcode.logging.SimRunTest --rerun -i --stacktrace \
            | grep -E "SIMRUN|FAILED|error:|BUILD|Exception" || true
          test -f "$RUNNER_TEMP/sim/result.json" && ! grep -q '"error"' "$RUNNER_TEMP/sim/result.json"

      - name: Publish to sim-results
        if: steps.request.outputs.skip != 'true'
        env:
          AUTO: ${{ steps.request.outputs.auto }}
          SIM_OK: ${{ steps.sim.outcome }}
        run: |
          git fetch -q --depth=1 origin sim-results:refs/remotes/origin/sim-results || true
          export SOURCE_DAY="$(git log -1 --format=%cs)"
          python3 - <<'EOF'
          import json, os, shutil, datetime
          sim = os.path.join(os.environ["RUNNER_TEMP"], "sim")
          sha, auto = os.environ["GITHUB_SHA"], os.environ["AUTO"]
          run_url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          path = os.path.join(sim, "result.json")
          result = json.load(open(path)) if os.path.exists(path) else {}
          if os.environ["SIM_OK"] != "success" and not result.get("error"):
              result["error"] = "The simulation did not finish: see the Action's log."
          runs = result.get("runs") or []
          # The median run by points, the earlier seed on a tie: the Visualizer's "typical" seed.
          def typical_of(runs):
              ordered = sorted(runs, key=lambda r: (r["points"], r["seed"]))
              return ordered[(len(ordered) - 1) // 2] if ordered else None
          # The best run: a clean one first (no G409 touch, no collision: the Q&A's Q17 makes a touch a foul every
          # time, 14 Oct 2026), then most points, then the earliest last TIP, then the lower seed.
          def last_tip(r):
              counted = r["tipsAt"][: int(r["autoTips"])]
              return counted[-1] if counted else float("inf")
          def fouled(r):
              return r.get("g409", 0) > 0 or r.get("robotsCollidedAt") is not None
          def best_of(runs):
              return min(runs, key=lambda r: (fouled(r), -r["points"], last_tip(r), r["seed"])) if runs else None
          typical, best = typical_of(runs), best_of(runs)
          request = json.load(open(os.path.join(sim, "request.json")))
          result.update({
              "auto": auto, "commit": sha, "branch": os.environ["GITHUB_REF_NAME"], "pp": request.get("pp"),
              "runUrl": run_url, "finishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "request": request, "typicalSeed": typical["seed"] if typical else None,
              "bestSeed": best["seed"] if best else None, "logs": {},
          })
          out = os.path.join(os.environ["RUNNER_TEMP"], "publish", auto, sha)
          os.makedirs(out, exist_ok=True)
          # The logs to watch: the best run and the typical one (one file when they are the same seed).
          for run in (best, typical):
              if run and str(int(run["seed"])) not in result["logs"]:
                  name = f"{auto}-{sha[:7]}-seed-{int(run['seed'])}.wpilog"
                  shutil.copy(os.path.join(sim, run["log"]), os.path.join(out, name))
                  result["logs"][str(int(run["seed"]))] = name
          # Fixed names for the newest result, so a README can link a download that outlives the
          # KEEP_RUNS cleanup (which removes only <auto>/<commit>/ folders): one set per robot design,
          # and <auto>/latest* for the Auto's usual design (see the top of this file).
          import re, subprocess
          design = result.get("design") or request.get("design") or "default"
          slug = re.sub(r"[^a-z0-9]+", "-", design.lower()).strip("-")
          result["designFolder"] = f"designs/{slug}"
          usual = None
          shown = subprocess.run(["git", "show", f"origin/sim-results:{auto}/latest.json"], capture_output=True, text=True)
          if shown.returncode == 0:
              try:
                  usual = json.loads(shown.stdout).get("design")
              except ValueError:
                  pass
          targets = [os.path.join(os.path.dirname(out), "designs", slug)]
          if usual is None or usual == design or request.get("usual") is True:
              targets.append(os.path.dirname(out))
          # And the same logs named for what they are and when: <title>_<Robot>_<date of the commit that changed
          # the Auto>_<best|typical>, so a downloaded file says which Auto it is and how new (the request's "title",
          # else the Auto's file name). One per Auto, design folder, day and label; kept, so a README's link stays good.
          # With the robot design too (6 Oct 2026: every log is one robot): "flat intake, rigid V" -> FlatIntakeRigidV.
          title = "".join(c if c.isalnum() or c in "-_." else "-" for c in (request.get("title") or auto))
          robot = "".join(w[:1].upper() + w[1:] for w in re.split(r"[^A-Za-z0-9]+", design) if w and design != "default")
          named = f"{title}_{robot}" if robot else title
          day = os.environ["SOURCE_DAY"]
          for label, run in (("best", best), ("typical", typical)):
              if run:
                  result.setdefault("namedLogs", {})[label] = f"{named}_{day}_{label}.wpilog"
          # Each partner run the request listed (SimRunTest's "entries"; the first is the Auto alone, published
          # above): its own result.json and watched logs under <auto>/<commit>/<partner>/<timing>/, and the newest
          # at <auto>/with/<partner>/<timing>/ (3 Nov 2026: a curated set of partner stand-ins, each at a spread of
          # timings, so we see when we would crash with them and how our waits' time limits hold up).
          for entry in result.get("entries") or []:
              folder = entry.get("folder") or ""
              if not folder:
                  continue
              path = os.path.join(sim, folder, "result.json")
              if not os.path.exists(path):
                  entry["error"] = "this run did not finish: see the Action's log"
                  continue
              sub = json.load(open(path))
              sub_runs = sub.get("runs") or []
              sub_typical, sub_best = typical_of(sub_runs), best_of(sub_runs)
              sub.update({
                  "auto": auto, "commit": sha, "branch": os.environ["GITHUB_REF_NAME"], "pp": request.get("pp"),
                  "runUrl": run_url, "finishedAt": result["finishedAt"], "request": request,
                  "typicalSeed": sub_typical["seed"] if sub_typical else None,
                  "bestSeed": sub_best["seed"] if sub_best else None, "logs": {}, "folder": folder,
              })
              sub_out = os.path.join(out, folder)
              os.makedirs(sub_out, exist_ok=True)
              tag = folder.replace("/", "-")
              for run in (sub_best, sub_typical):
                  if run and str(int(run["seed"])) not in sub["logs"]:
                      name = f"{auto}-{sha[:7]}-{tag}-seed-{int(run['seed'])}.wpilog"
                      shutil.copy(os.path.join(sim, folder, run["log"]), os.path.join(sub_out, name))
                      sub["logs"][str(int(run["seed"]))] = name
              entry.update({"typicalSeed": sub["typicalSeed"], "bestSeed": sub["bestSeed"], "logs": sub["logs"]})
              text = json.dumps(sub, indent=1)
              open(os.path.join(sub_out, "result.json"), "w").write(text)
              latest = os.path.join(os.path.dirname(out), "with", folder)
              os.makedirs(latest, exist_ok=True)
              for label, run in (("best", sub_best), ("typical", sub_typical)):
                  if run:
                      shutil.copy(os.path.join(sim, folder, run["log"]), os.path.join(latest, f"latest-{label}.wpilog"))
              open(os.path.join(latest, "latest.json"), "w").write(text)
          text = json.dumps(result, indent=1)
          open(os.path.join(out, "result.json"), "w").write(text)
          for target in targets:
              os.makedirs(target, exist_ok=True)
              for label, run in (("best", best), ("typical", typical)):
                  if run:
                      shutil.copy(os.path.join(sim, run["log"]), os.path.join(target, f"latest-{label}.wpilog"))
                      shutil.copy(os.path.join(sim, run["log"]), os.path.join(target, f"{named}_{day}_{label}.wpilog"))
              open(os.path.join(target, "latest.json"), "w").write(text)

          summary = [f"### {auto} at `{sha[:7]}`", ""]
          if result.get("error"):
              summary.append(f"**Error:** {result['error']}")
          # The results table: one row per run, the Auto alone and then each partner at each timing (SimRunTest.row).
          def sec(t):
              return "never" if t is None else f"{t:.1f} s"
          def wait_words(w):
              if not w:
                  return "no wait"
              if w.get("at") is None:
                  return f"{w['label']}: still waiting at 30 s"
              how = "fired" if w.get("fired") else "timed out"
              what = "" if how == "timed out" else f" ({w['outcome']})"
              return f"{how}{what} at {w['at']:.1f} s, after {w['after']:.1f} s"
          entries = result.get("entries") or []
          if entries:
              summary += ["| Run | Seed | Points | Our launches | TIPs at | Our wait | Robots collide | Parked |",
                          "|---|---|---|---|---|---|---|---|"]
              for entry in entries:
                  label = entry["name"] if not entry.get("partner") else f"{entry.get('partnerSource') or entry['partner']} · {entry['name']}"
                  label = label.replace("|", "\\|").replace("\n", " ")
                  if entry.get("error"):
                      summary.append(f"| {label} | | | | | | | {entry['error']} |")
                  for r in entry.get("rows") or []:
                      star = (" ▲" if entry.get("bestSeed") == r["seed"] else "") + (" ★" if entry.get("typicalSeed") == r["seed"] else "")
                      launches = f"{int(r['launched'])}" + ("" if r.get("partnerLaunched") is None else f" (partner {int(r['partnerLaunched'])})")
                      parked = ("yes" if r["parked"] else "no") + ("" if r.get("partnerParked") is None else f" (partner {'yes' if r['partnerParked'] else 'no'})")
                      tips = ", ".join(f"{t:.1f}" for t in r["tipsAt"]) or "none"
                      summary.append(f"| {label} | {int(r['seed'])}{star} | {int(r['points'])} | {launches} | {tips} | {wait_words(r.get('wait'))} | {sec(r.get('robotsCollidedAt'))} | {parked} |")
                  if entry.get("meanPoints") is not None:
                      summary.append(f"| **{label}: mean** | | **{entry['meanPoints']:.0f}** | | | | | |")
              summary.append("")
              summary.append("▲ the best seed, ★ the typical (median) seed of each run. Alone is published as before; each partner run "
                             "under `<auto>/<commit>/<partner>/<timing>/` and `<auto>/with/<partner>/<timing>/latest.json`.")
          elif runs:
              summary += ["| Seed | Points | TIPs at (s) | LEAVE / PARK |", "|---|---|---|---|"]
              for r in runs:
                  lp = " · ".join(f'{"yes" if x["leave"] else "no"} / {"yes" if x["park"] else "no"}' for x in r["robots"])
                  star = (" ▲ best" if best and r["seed"] == best["seed"] else "") + (" ★" if typical and r["seed"] == typical["seed"] else "")
                  summary.append(f'| {int(r["seed"])}{star} | {int(r["points"])} | {", ".join(f"{t:.1f}" for t in r["tipsAt"]) or "none"} | {lp} |')
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(summary) + "\n")
          EOF

          # Rebuild sim-results: what it had, plus this run, minus all but the newest KEEP_RUNS.
          mkdir -p "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin sim-results; then git checkout -q FETCH_HEAD -- . ; fi
          cp -r "$RUNNER_TEMP/publish/." .
          python3 - <<'EOF'
          import glob, json, os, shutil
          runs = []
          for f in glob.glob("*/*/result.json"):
              try:
                  runs.append((json.load(open(f)).get("finishedAt", ""), os.path.dirname(f)))
              except ValueError:
                  runs.append(("", os.path.dirname(f)))
          for _, d in sorted(runs, reverse=True)[int(os.environ["KEEP_RUNS"]):]:
              shutil.rmtree(d)
          EOF
          printf '# Simulated Autos\n\nWritten by the "Simulate Auto" workflow; read by the Visualizer. Rewritten on every run.\n' > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Simulated ${{ steps.request.outputs.auto }} at ${GITHUB_SHA::7}"
          git push -q -f origin HEAD:refs/heads/sim-results

      - name: Fail if the simulation failed
        if: steps.request.outputs.skip != 'true' && steps.sim.outcome != 'success'
        run: |
          echo "The simulation failed; its error is in sim-results and in the summary above."
          exit 1
