apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Sloth Load plugin — enables Sinister fast dex scanning at OpMode discovery
// time (~50% faster init vs. plain FTC SDK reflective scanning). Required for
// the Sloth runtime dependency below to function. Must stay version-locked to
// the Sloth runtime and to the Sloth-variant builds of Panels / FTC Dashboard;
// see TeamCode/README.md.
buildscript {
    repositories {
        mavenCentral()
        google() // Load 0.3.2 pulls com.android.tools.build:gradle transitively
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

// Keep the bundled robot configs alive across a Sloth Load (issue #71).
//
// Sloth's `dexSloth` task packs dexBuilderDebug's output but excludes "*.jar",
// and AGP dexes the R classes into exactly those jars. So the Sloth Load dex
// has no org.firstinspires.ftc.teamcode.R$xml, and Sloth's
// RobotConfigResScanner, which builds the Driver Station's config list from
// the R$xml classes the TeamCode loader holds, rebuilds it empty. These two
// tasks dex TeamCode's own R and R$xml (nothing else: Sloth Load stays small)
// and add them to the Sloth dex. The IDs must match the installed APK, which
// they do until a resource is added or removed — that already needs a full
// TeamCode install. See TeamCode/README.md § "Risk: bundled configs depend on
// Sloth, not just the SDK".
def slothRClassDir = layout.buildDirectory.dir('intermediates/sloth_r_classes')
def slothRDexDir = layout.buildDirectory.dir('intermediates/sloth_r_dex')
def rClassJar = layout.buildDirectory.file(
        'intermediates/compile_and_runtime_not_namespaced_r_class_jar/debug/processDebugResources/R.jar')

def extractSlothRClasses = tasks.register('extractSlothRClasses', Sync) {
    dependsOn 'processDebugResources'
    from(zipTree(rClassJar)) {
        include 'org/firstinspires/ftc/teamcode/R.class'
        include 'org/firstinspires/ftc/teamcode/R$xml.class'
    }
    into slothRClassDir
    doLast {
        if (!slothRClassDir.get().file('org/firstinspires/ftc/teamcode/R$xml.class').asFile.exists()) {
            throw new GradleException("TeamCode's R\$xml is not in ${rClassJar.get().asFile}: " +
                    "AGP moved the R jar, and a Sloth Load would empty the Driver Station's config list.")
        }
    }
}

def dexSlothR = tasks.register('dexSlothR') {
    dependsOn extractSlothRClasses
    inputs.dir slothRClassDir
    outputs.dir slothRDexDir
    doLast {
        def out = slothRDexDir.get().asFile
        project.delete(out)
        out.mkdirs()
        def builder = com.android.tools.r8.D8Command.builder()
        project.fileTree(slothRClassDir).each { builder.addProgramFiles(it.toPath()) }
        com.android.tools.r8.D8.run(builder
                .setMode(com.android.tools.r8.CompilationMode.DEBUG)
                .setOutput(out.toPath(), com.android.tools.r8.OutputMode.DexIndexed)
                .build())
    }
}

tasks.named('dexSloth') {
    dependsOn dexSlothR
    from(slothRDexDir) {
        into 'org/firstinspires/ftc/teamcode'
        rename 'classes.dex', 'R.sloth.dex'
    }
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://repo.dairy.foundation/snapshots" }
}

dependencies {
    implementation project(':FtcRobotController')

    // Sloth runtime — Sinister fast dex scanning. Paired with the Sloth Load
    // Gradle plugin applied above.
    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")

    // Pedro Pathing 3.x. The 2.x `com.pedropathing:ftc` fat artifact no longer
    // exists: 3.x splits into `core` (pure Java pathing/math, no Android or FTC
    // SDK types) and `revhub` (the REV hardware layer — drivetrains, localizers,
    // IMU). `revhub` already brings `core` transitively; `core` is declared
    // explicitly so its version is pinned here rather than inherited.
    implementation('com.pedropathing:core:3.0.1')
    implementation('com.pedropathing:revhub:3.0.1')

    // AutoTune — the robot-hosted tuning webpage that backs the OpModes in
    // org.firstinspires.ftc.teamcode.pedro. Separate artifact in 3.x, and the
    // reason the Sloth stack above is pinned to 0.3.2 (AutoTune requires it).
    implementation('com.pedropathing:tuning:1.0.1')

    // Ivy (command-based control flow). 1.1.x is the Pedro 3 pairing —
    // 1.1.1 is compiled against com.pedropathing:core:3.0.0. 1.0.1 was built
    // against Pedro 2 and will not link against the 3.x classes.
    implementation('com.pedropathing.ivy:pedro:1.1.1')

    // Dairy CachingHardware: wraps motors/servos to skip redundant
    // setPower/setPosition calls when the new value is within tolerance of
    // the cached one.
    implementation('dev.frozenmilk.dairy:CachingHardware:1.0.0')

    // Panels — Sloth-compatible variant (replaces com.bylazar:fullpanels)
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")

    // FTC Dashboard is deliberately absent. It and Panels each work alone; with
    // both present the Robot Controller crash-loops on a BindException before
    // it ever reaches "Robot Status: running", so the Driver Station shows no
    // heartbeat and no OpModes. Removing either one fixes it. Measured on a
    // Control Hub v1.0, SDK 12.0, Sloth 0.3.2, 24 Sep 2026.
    //     implementation("com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0")
    // Do not re-add it without reading TeamCode/README.md § "Why FTC Dashboard
    // is not in the dependency set" first. Losing it costs the desktop
    // AdvantageScope stream, which is a real loss and is tracked separately.

    testImplementation 'junit:junit:4.13.2'
}
