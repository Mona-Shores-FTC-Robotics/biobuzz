apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// LADDER BRANCH — see LADDER.md at the repo root.
//
// This file is generated one rung at a time. Each rung is a commit that adds
// exactly one library to the one before it. Install a rung with the TeamCode
// run configuration, watch the hub, record pass or fail, move to the next.
//
// It is not master's build.gradle and is not for merging. The per-dependency
// rationale comments that belong here live on master; they were stripped so
// that the only difference between two rungs is the dependency being tested.
//

buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}


// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // No team-authored Java compiles until rung 8. Every file is still on disk
    // and still tracked by git; only the compiler stops seeing them.
    sourceSets {
        main.java.srcDirs = ['src/spike/no-team-code']
        test.java.srcDirs = []
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://repo.dairy.foundation/snapshots" }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")
    implementation("com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0")
    implementation('com.pedropathing:core:3.0.1')
    implementation('com.pedropathing:revhub:3.0.1')
    implementation('com.pedropathing.ivy:pedro:1.1.1')
    implementation('dev.frozenmilk.dairy:CachingHardware:1.0.0')
    implementation('com.pedropathing:tuning:1.0.1')

    testImplementation 'junit:junit:4.13.2'
}
