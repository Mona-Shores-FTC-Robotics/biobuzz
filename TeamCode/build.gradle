apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Sloth Load plugin — enables Sinister fast dex scanning at OpMode discovery
// time (~50% faster init vs. plain FTC SDK reflective scanning). Required for
// the Sloth runtime dependency below to function. Must stay version-locked to
// the Sloth runtime and to the Sloth-variant builds of Panels / FTC Dashboard;
// see TeamCode/README.md.
buildscript {
    repositories {
        mavenCentral()
        google() // Load 0.3.2 pulls com.android.tools.build:gradle transitively
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://repo.dairy.foundation/snapshots" }
}

dependencies {
    implementation project(':FtcRobotController')

    // Sloth runtime — Sinister fast dex scanning. Paired with the Sloth Load
    // Gradle plugin applied above.
    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")

    // Pedro Pathing 3.x. The 2.x `com.pedropathing:ftc` fat artifact no longer
    // exists: 3.x splits into `core` (pure Java pathing/math, no Android or FTC
    // SDK types) and `revhub` (the REV hardware layer — drivetrains, localizers,
    // IMU). `revhub` already brings `core` transitively; `core` is declared
    // explicitly so its version is pinned here rather than inherited.
    implementation('com.pedropathing:core:3.0.1')
    implementation('com.pedropathing:revhub:3.0.1')

    // AutoTune — the robot-hosted tuning webpage that backs the OpModes in
    // org.firstinspires.ftc.teamcode.pedro. Separate artifact in 3.x, and the
    // reason the Sloth stack above is pinned to 0.3.2 (AutoTune requires it).
    implementation('com.pedropathing:tuning:1.0.1')

    // Ivy (command-based control flow). 1.1.x is the Pedro 3 pairing —
    // 1.1.1 is compiled against com.pedropathing:core:3.0.0. 1.0.1 was built
    // against Pedro 2 and will not link against the 3.x classes.
    implementation('com.pedropathing.ivy:pedro:1.1.1')

    // Dairy CachingHardware: wraps motors/servos to skip redundant
    // setPower/setPosition calls when the new value is within tolerance of
    // the cached one.
    implementation('dev.frozenmilk.dairy:CachingHardware:1.0.0')

    // Panels — Sloth-compatible variant (replaces com.bylazar:fullpanels)
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")

    // FTC Dashboard — Sloth-compatible variant (replaces
    // com.acmerobotics.dashboard:dashboard). Kept alongside Panels for passive
    // monitoring, and load-bearing for AdvantageScope below: the packet stream
    // this publishes is what AdvantageScope reads. No longer "future".
    implementation("com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0")

    // AdvantageScope Lite — hosts AdvantageScope on the robot itself at
    // http://192.168.43.1:8080/as/ , so it needs no desktop install. It reads
    // the FTC Dashboard packet stream above, which is what makes the shooter
    // rig's telemetry show up as a browsable tree.
    //
    // j5155's unofficial port for the current control system; the official
    // Lite targets Systemcore (2027) only. It is Sloth-aware -- it resolves
    // com.acmerobotics.slothboard:core and the com.bylazar.sloth:* modules at
    // our exact 0.3.2+ versions, not the plain com.acmerobotics.dashboard
    // build, so it joins the locked set rather than fighting it. No exclude
    // needed; checked with :TeamCode:dependencies.
    //
    // Only v26.0.0 is published (dairy maven, 2025-09-07). Upstream
    // AdvantageScope is active, but this FTC package has not been
    // republished, so do not expect a version bump to be available.
    implementation("page.j5155.AdvantageScope:lite:v26.0.0")

    testImplementation 'junit:junit:4.13.2'
}
